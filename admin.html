<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel admin · iEat Fast Food</title>
<link rel="icon" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Lobster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<script>
  (function(){try{var t=localStorage.getItem('ieat_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();
</script>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<!-- Login -->
<section class="login" id="login">
  <form class="glass login-card" id="loginForm" autocomplete="on">
    <img src="/assets/logo.webp" alt="iEat Fast Food" class="login-logo">
    <h1>Panel administrateur</h1>
    <p class="muted">Connecte-toi pour gérer le site, la carte, le stock et l’équipe.</p>
    <label class="field"><span>Nom d’utilisateur</span><input name="user" autocomplete="username" required></label>
    <label class="field"><span>Mot de passe</span>
      <div class="pw"><input name="pass" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    </label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="gbtn primary" type="submit"><span>Se connecter</span></button>
    <a class="back" href="/">← Retour au site</a>
  </form>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side glass">
    <a class="side-brand" href="/" target="_blank" rel="noopener"><img src="/assets/logo.webp" alt=""><span><b>iEat</b> Admin</span></a>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <span class="sync" id="sync"><i></i><span>—</span></span>
    </div>
  </aside>
  <main class="main">
    <header class="bar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
      <div>
        <h2 id="viewTitle">Tableau de bord</h2>
        <p class="muted" id="viewSub"></p>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Mode sombre"><span class="ti"></span></button>
        <a class="gbtn" href="/" target="_blank" rel="noopener">Voir le site ↗</a>
        <button class="gbtn" id="logout" type="button">Déconnexion</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="/js/data.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
